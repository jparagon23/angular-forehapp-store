<app-navbar />

<div class="seller-layout">
  <aside class="seller-sidebar">
    <div class="seller-brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
        <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
      </svg>
      <span>Panel Seller</span>
    </div>

    <div class="store-selector">
      <ng-container *ngIf="(activeStoreId$ | async) as activeId; else noStore">
        <div class="store-active-label">Tienda activa</div>
        <div class="store-active-name">{{ activeStoreName$ | async }}</div>
        <div *ngIf="myStores.length > 1" class="store-switch-list">
          <button
            *ngFor="let s of myStores"
            class="store-switch-btn"
            [class.selected]="s.storeId === activeId"
            (click)="selectStore(s)"
          >{{ s.name }}</button>
        </div>
      </ng-container>
      <ng-template #noStore>
        <div *ngIf="myStores.length > 1" class="store-pick-label">Selecciona una tienda</div>
        <div class="store-switch-list">
          <button
            *ngFor="let s of myStores"
            class="store-switch-btn"
            (click)="selectStore(s)"
          >{{ s.name }}</button>
        </div>
        <div *ngIf="myStores.length === 0 && !storesError" class="store-empty">Sin tiendas asignadas</div>
        <div *ngIf="storesError" class="store-empty store-error">{{ storesError }}</div>
      </ng-template>
    </div>
    <nav class="seller-nav">
      <a routerLink="stats" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Estadísticas
      </a>
      <a routerLink="products/create" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Crear Producto
      </a>
      <a routerLink="products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
        </svg>
        Mis Productos
      </a>
      <a routerLink="orders" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Pedidos
      </a>
      <a routerLink="coupons" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        Cupones
      </a>
    </nav>

    <div class="seller-panel-links">
      <a *ngIf="hasAdmin$ | async" routerLink="/admin" class="panel-link panel-link-admin">
        Panel Admin →
      </a>
      <a routerLink="/stores" class="panel-link panel-link-stores">
        Mis Tiendas →
      </a>
    </div>
  </aside>

  <main class="seller-content">
    <router-outlet />
  </main>
</div>
