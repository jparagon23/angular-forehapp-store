<app-admin-topbar title="Descuentos y Cupones"></app-admin-topbar>

<div class="content">
  <div class="table-card">
    <div class="table-header">
      <h3>Cupones y descuentos</h3>
      <button class="btn btn-green" (click)="modalOpen.set(true)">+ Nuevo cupón</button>
    </div>
    <table>
      <thead>
        <tr><th>Código</th><th>Descuento</th><th>Aplicable a</th><th>Usos</th><th>Validez</th><th>Estado</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of discounts$ | async">
          <td><strong style="letter-spacing:1px">{{ d.code }}</strong></td>
          <td>{{ d.val }}{{ d.type === '%' ? '%' : ' COP' }}</td>
          <td>{{ d.scope }}</td>
          <td>{{ d.used }}/{{ d.uses }}</td>
          <td style="font-size:.82rem">{{ d.from }} → {{ d.to }}</td>
          <td>
            <span class="stock-badge" [class]="d.active ? 'stock-ok' : 'stock-out'">
              {{ d.active ? 'Activo' : 'Vencido' }}
            </span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn btn-outline btn-sm" (click)="toggle(d.code)">{{ d.active ? 'Pausar' : 'Activar' }}</button>
              <button class="btn btn-red btn-sm" (click)="delete(d.code)">🗑</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" [class.open]="modalOpen()">
  <div class="modal">
    <h2>Nuevo cupón de descuento</h2>
    <div class="form-grid">
      <div class="form-group"><label>Código</label><input [(ngModel)]="form.code" placeholder="TENIS20" style="text-transform:uppercase" /></div>
      <div class="form-group"><label>Tipo</label>
        <select [(ngModel)]="form.type"><option value="%">Porcentaje (%)</option><option value="COP">Monto fijo (COP)</option></select>
      </div>
      <div class="form-group"><label>Valor</label><input type="number" [(ngModel)]="form.val" /></div>
      <div class="form-group"><label>Usos máximos</label><input type="number" [(ngModel)]="form.uses" /></div>
      <div class="form-group full"><label>Aplicable a</label>
        <select [(ngModel)]="form.scope"><option *ngFor="let s of scopes" [value]="s">{{ s }}</option></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" (click)="modalOpen.set(false)">Cancelar</button>
      <button class="btn btn-green" (click)="save()">Crear cupón</button>
    </div>
  </div>
</div>
