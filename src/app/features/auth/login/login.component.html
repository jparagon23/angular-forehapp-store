<div class="auth-page">
  <div class="auth-card">

    <a routerLink="/" class="auth-brand">
      <span class="auth-brand-name">Forehapp <span>Store</span></span>
    </a>

    <h1 class="auth-title">Iniciar sesión</h1>

    <div class="info-notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span>¿Ya tienes una cuenta en <strong>Forehapp</strong>? Inicia sesión directamente con tu correo y contraseña.</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [class.invalid]="submitted && email.invalid"
          autocomplete="email"
          (input)="loginError = ''"
        />
        <span class="form-error" *ngIf="submitted && email.hasError('required')">Ingresa tu correo.</span>
        <span class="form-error" *ngIf="submitted && email.hasError('email')">Correo no válido.</span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input
            id="password"
            [type]="showPass ? 'text' : 'password'"
            formControlName="password"
            [class.invalid]="submitted && password.invalid"
            autocomplete="current-password"
            (input)="loginError = ''"
          />
          <button type="button" class="toggle-pass" (click)="showPass = !showPass">
            {{ showPass ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <span class="form-error" *ngIf="submitted && password.hasError('required')">Ingresa tu contraseña.</span>
        <span class="form-error" *ngIf="submitted && password.hasError('minlength')">Mínimo 6 caracteres.</span>
      </div>

      <div class="login-error" *ngIf="loginError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ loginError }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>

    </form>

    <div class="auth-divider"><span>¿Eres nuevo en Forehapp?</span></div>

    <a routerLink="/register" class="btn-secondary">Crear tu cuenta Forehapp</a>

  </div>
</div>
