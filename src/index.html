<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ForehappStore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/svg/logoMin.svg">
  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #f2f7f2;
    }
    .app-splash img {
      width: 56px;
      height: 56px;
    }
    .app-splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d6ead6;
      border-top-color: #42AA14;
      border-radius: 50%;
      animation: splash-spin 0.7s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-splash">
      <img src="assets/svg/logoMin.svg" alt="">
      <div class="app-splash-spinner"></div>
    </div>
  </app-root>
</body>
</html>
